<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="Простір корисного контенту — практичні поради на будь-який випадок життя.">
<title>Простір корисного контенту</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="./config.js"></script>
<style>
:root{--bg:#080807;--card:#151412;--card2:#1b1915;--gold:#d6b35c;--gold2:#f1d98f;--text:#f8f3e6;--muted:#aaa395;--line:rgba(214,179,92,.28);--danger:#ffd5d5;--shadow:0 18px 55px rgba(0,0,0,.34)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -8%,rgba(214,179,92,.15),transparent 35%),linear-gradient(180deg,#11110f,#080807 58%,#050505)}button{font:inherit}.app{width:min(760px,100%);margin:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}.header{text-align:center;padding:5px 0 14px}.logo{width:92px;height:96px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 11px;box-shadow:0 0 42px rgba(214,179,92,.16)}.brand{font-family:Georgia,serif;font-size:29px;letter-spacing:5px;margin:0;font-weight:700;color:#f7ebca}.brand-sub{margin-top:6px;color:var(--gold);font-size:10px;letter-spacing:3px;font-weight:800}.ornament{height:1px;width:95px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.greeting{text-align:center;color:#d9d2c1;font-size:14px;margin:0 0 14px}.greeting b{color:var(--gold2)}.screen{display:none}.screen.active{display:block}.hero,.advice-card,.limit-card,.premium-card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(28,27,23,.98),rgba(12,12,11,.99));box-shadow:var(--shadow)}.hero{text-align:center;padding:22px 18px;margin-bottom:14px}.kicker{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}.hero h2{font-family:Georgia,serif;font-size:23px;line-height:1.3;margin:0 0 9px;color:#fff5dc}.hero p{font-size:14px;line-height:1.6;color:#d0cbc0;margin:0}.premium-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(214,179,92,.34);border-radius:20px;padding:14px 15px;margin-bottom:15px;background:linear-gradient(135deg,rgba(214,179,92,.12),rgba(18,17,14,.96))}.premium-banner strong{font-size:13px}.premium-banner span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.gold-btn{border:1px solid rgba(214,179,92,.5);border-radius:13px;background:rgba(214,179,92,.12);color:var(--gold2);font-weight:850;padding:10px 12px;font-size:12px;cursor:pointer;white-space:nowrap}.section-title{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.section-title strong{font-family:Georgia,serif;font-size:18px}.section-title span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{min-height:108px;text-align:left;border:1px solid rgba(214,179,92,.21);border-radius:18px;padding:14px 13px;background:linear-gradient(145deg,rgba(27,26,22,.98),rgba(14,14,13,.98));color:var(--text);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .12s,border-color .12s}.cat:active{transform:scale(.985);border-color:rgba(214,179,92,.55)}.ico{display:block;font-size:24px;margin-bottom:9px}.cat-title{font-size:13px;line-height:1.25;font-weight:780}.cat-sub{font-size:10px;line-height:1.35;color:var(--muted);margin-top:5px}.back{border:0;background:none;color:var(--gold2);padding:2px 0 12px;font-size:14px;cursor:pointer}.advice-card{padding:23px 19px}.advice-category{display:flex;gap:8px;align-items:center;color:var(--gold);font-size:11px;font-weight:850;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:15px}.advice-label{font-size:10px;color:#9e988c;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.advice{font-family:Georgia,serif;font-size:20px;line-height:1.62;color:#fff7e7}.actions{margin-top:11px}.primary{width:100%;border:0;border-radius:16px;padding:15px 13px;background:linear-gradient(135deg,#c69d43,#efd383);color:#15130e;font-weight:900;font-size:15px;cursor:pointer}.secondary{width:100%;margin-top:9px;border:1px solid rgba(214,179,92,.34);border-radius:16px;padding:13px;background:rgba(214,179,92,.07);color:var(--gold2);font-weight:780;font-size:13px;cursor:pointer}.limit-card{text-align:center;padding:30px 19px}.moon{font-size:38px;margin-bottom:8px}.limit-card strong{font-family:Georgia,serif;font-size:22px;display:block;color:#fff1ce}.limit-card p{font-size:14px;line-height:1.65;color:#c9c3b7;margin:11px 0 0}.limit-card .gold-btn{margin-top:16px}.premium-card{text-align:center;padding:27px 20px}.premium-card .star{font-size:38px}.premium-card h2{font-family:Georgia,serif;font-size:24px;margin:9px 0 8px}.premium-card p{font-size:14px;line-height:1.65;color:#c9c3b7;margin:0}.price{color:var(--gold2);font-weight:900;margin:14px 0}.benefits{text-align:left;list-style:none;padding:0;max-width:380px;margin:12px auto 17px;color:#e1dbce;font-size:13px;line-height:1.9}.benefits li:before{content:'✓';color:var(--gold);font-weight:900;margin-right:8px}.note{font-size:10px;line-height:1.45;color:#807b70;margin-top:12px}.loading{text-align:center;padding:44px 12px;color:var(--gold2);font-size:14px}.spinner{display:inline-block;width:19px;height:19px;border:2px solid rgba(214,179,92,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-5px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.error{border:1px solid rgba(255,120,120,.25);background:rgba(120,20,20,.12);border-radius:18px;padding:16px;color:var(--danger);font-size:13px;line-height:1.55;text-align:center}.footer{text-align:center;color:#706b61;font-size:10px;margin-top:18px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.logo{width:108px;height:112px}.brand{font-size:32px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><img class="logo" id="appLogo" src="./logo.png" opacity="0" onerror="this.onerror=null;this.src='./assets/logo.png';" alt="Простір корисного контенту"><h1 class="brand">ПРОСТІР</h1><div class="brand-sub">КОРИСНОГО КОНТЕНТУ</div><div class="ornament"></div></header>
<div id="greeting" class="greeting"></div>
<main>
<section id="home" class="screen active">
<div class="hero"><div class="kicker">✨ Порада на будь-який випадок життя</div><h2>Що вас цікавить сьогодні?</h2><p>Оберіть тему й отримайте коротку практичну пораду, яку можна застосувати вже зараз.</p></div>
<div class="premium-banner"><div><strong>⭐ Преміум</strong><span>Більше свободи — без щоденного обмеження</span></div><button class="gold-btn" id="premiumHomeBtn">Дізнатися</button></div>
<div class="section-title"><strong>Оберіть тему</strong><span>15 напрямів</span></div><div id="grid" class="grid"></div><div class="footer">Корисне поруч тоді, коли воно справді потрібне 💛</div>
</section>
<section id="adviceScreen" class="screen"><button class="back" id="backBtn">← До категорій</button><div id="adviceContent"></div></section>
<section id="premiumScreen" class="screen"><button class="back" id="premiumBackBtn">← До категорій</button><div id="premiumContent"></div></section>
</main></div>
<script>
(()=>{
const LIMIT=10, CFG=window.PROSTIR_CONFIG||{}, KEY='prostir_state_v2';
const categories=[
{id:'partners',title:'Подружжя та партнерські стосунки',sub:'Довіра, побут, конфлікти',icon:'❤️',file:'01-partners.txt'},
{id:'parents',title:'Батьки та діти',sub:'Виховання, спілкування, підтримка',icon:'👨‍👩‍👧',file:'02-parents-children.txt'},
{id:'car',title:'Автомобіль та безпека на дорозі',sub:'Поїздки, догляд, безпека',icon:'🚗',file:'03-car-road.txt'},
{id:'work',title:'Робота та колеги',sub:'Комунікація, задачі, робочі ситуації',icon:'💼',file:'04-work-colleagues.txt'},
{id:'influence',title:'Психологія впливу та переговори',sub:'Переконання, аргументи, домовленості',icon:'🧠',file:'05-influence-negotiations.txt'},
{id:'finance',title:'Особисті фінанси',sub:'Бюджет, покупки, заощадження',icon:'💰',file:'06-finance.txt'},
{id:'habits',title:'Здорові звички та самопочуття',sub:'Сон, рух, щоденні звички',icon:'🌿',file:'07-healthy-habits.txt'},
{id:'self',title:'Саморозвиток і дисципліна',sub:'Цілі, звички, особиста ефективність',icon:'🎯',file:'08-self-development.txt'},
{id:'home',title:'Дім та побут',sub:'Порядок, зберігання, щоденні справи',icon:'🏠',file:'09-home-household.txt'},
{id:'digital',title:'Цифрова безпека',sub:'Акаунти, паролі, приватність',icon:'🔐',file:'10-digital-security.txt'},
{id:'communication',title:'Комунікація та особисті межі',sub:'Розмови, прохання, межі',icon:'💬',file:'11-communication-boundaries.txt'},
{id:'time',title:'Час та продуктивність',sub:'Планування, фокус, справи',icon:'⏱️',file:'12-time-productivity.txt'},
{id:'travel',title:'Подорожі та поїздки',sub:'Підготовка, маршрут, документи',icon:'✈️',file:'13-travel.txt'},
{id:'career',title:'Кар’єра та професійний розвиток',sub:'Навички, резюме, можливості',icon:'📈',file:'14-career.txt'},
{id:'shopping',title:'Покупки та розумне споживання',sub:'Вибір, ціна, довговічність',icon:'🛍️',file:'15-shopping.txt'}];
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#090909');tg.setBackgroundColor('#090909');}catch(e){}}
const user=tg?.initDataUnsafe?.user||{};
const userId=String(user.id||'guest');
const greetingName=(user.first_name||user.username||'друже').trim();
let state={date:'',used:0,usedByCategory:{},premiumUntil:0};
let cache={}, currentCategory='', busy=false;
const localKey=KEY+'_'+userId;
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv'}).format(new Date())}
function cloudGet(key){return new Promise(resolve=>{if(tg?.CloudStorage?.getItem){tg.CloudStorage.getItem(key,(err,val)=>resolve(err?null:val));}else resolve(null)})}
function cloudSet(key,val){return new Promise(resolve=>{if(tg?.CloudStorage?.setItem){tg.CloudStorage.setItem(key,val,()=>resolve());}else resolve()})}
async function load(){let raw=await cloudGet('prostir_state_v2');if(!raw)raw=localStorage.getItem(localKey);if(raw){try{state=JSON.parse(raw)}catch(e){}}const d=today();if(state.date!==d){state={date:d,used:0,usedByCategory:{},premiumUntil:Number(state.premiumUntil||0)};await save()} }
async function save(){const raw=JSON.stringify(state);localStorage.setItem(localKey,raw);await cloudSet('prostir_state_v2',raw)}
function premium(){return Number(state.premiumUntil||0)>Date.now()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setGreeting(){document.getElementById('greeting').innerHTML=`Вітаємо, <b>${esc(greetingName)}</b> 💛`}
function renderCategories(){const grid=document.getElementById('grid');grid.innerHTML=categories.map(c=>`<button class="cat" data-id="${c.id}"><span class="ico">${c.icon}</span><span class="cat-title">${esc(c.title)}</span><span class="cat-sub">${esc(c.sub)}</span></button>`).join('');grid.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>getAdvice(b.dataset.id)))}
async function getTips(c){if(cache[c.id])return cache[c.id];const r=await fetch('data/'+c.file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Не вдалося завантажити файли порад. Перевірте наявність файлів у папці data/ на GitHub.');const t=await r.text();const a=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(a.length===0)throw new Error('Файл порожній.');cache[c.id]=a;return a}
function pick(c,len){let used=state.usedByCategory[c.id]||[];if(used.length>=len)used=[];const set=new Set(used);let i;do{i=Math.floor(Math.random()*len)}while(set.has(i)&&set.size<len);used=[...used,i];state.usedByCategory[c.id]=used;return i}
async function getAdvice(id){if(busy)return;if(!premium()&&state.used>=LIMIT){renderLimit();show('adviceScreen');return}const c=categories.find(x=>x.id===id);if(!c)return;busy=true;currentCategory=id;show('adviceScreen');document.getElementById('adviceContent').innerHTML='<div class="loading"><span class="spinner"></span>Готую для вас пораду…</div>';try{const tips=await getTips(c);const advice=tips[pick(c,tips.length)];if(!premium())state.used++;await save();renderAdvice(c,advice)}catch(e){document.getElementById('adviceContent').innerHTML=`<div class="error">${esc(e.message||'Сталася помилка. Спробуйте ще раз.')}</div>`}finally{busy=false}}
function renderAdvice(c,advice){document.getElementById('adviceContent').innerHTML=`<div class="advice-card"><div class="advice-category"><span>${c.icon}</span>${esc(c.title)}</div><div class="advice-label">Порада для вас</div><div class="advice">${esc(advice)}</div></div><div class="actions"><button class="primary" id="nextBtn">✨ Отримати наступну пораду</button><button class="secondary" id="premiumAdviceBtn">⭐ ${premium()?'Преміум активний':'Більше можливостей — Преміум'}</button></div>`;document.getElementById('nextBtn').addEventListener('click',()=>getAdvice(currentCategory));document.getElementById('premiumAdviceBtn').addEventListener('click',openPremium)}
function renderLimit(){document.getElementById('adviceContent').innerHTML='<div class="limit-card"><div class="moon">🌙</div><strong>Поверніться трохи пізніше</strong><p>На сьогодні ми вже підготували для вас достатньо порад. Якщо хочеться більше — ви можете підключити Преміум без щоденного обмеження.</p><button class="gold-btn" id="limitPremiumBtn">⭐ Дізнатися про Преміум</button></div>';document.getElementById('limitPremiumBtn').addEventListener('click',openPremium)}
function renderPremium(){const price=Number(CFG.premiumStars||10);const active=premium();document.getElementById('premiumContent').innerHTML=`<div class="premium-card"><div class="star">⭐</div><h2>${active?'Преміум активний':'Преміум для вас'}</h2><p>${active?'Зараз вам доступні необмежені поради. Користуйтеся на здоров’я 💛':'Отримуйте поради без щоденного обмеження протягом 30 днів.'}</p><div class="price">${active?'Доступ активний':'10 ⭐ / 30 днів'}</div><ul class="benefits"><li>необмежені поради</li><li>усі 15 категорій</li><li>зручний доступ до всього контенту</li></ul>${active?'':'<button class="primary" id="buyPremiumBtn">⭐ Підключити Преміум</button>'}<div class="note">Оплата проходить через Telegram Stars. Ціна та умови відображаються в платіжному вікні Telegram.</div></div>`;if(!active)document.getElementById('buyPremiumBtn').addEventListener('click',buyPremium)}
function openPremium(){renderPremium();show('premiumScreen')}
function buyPremium(){const url=String(CFG.premiumInvoiceUrl||'').trim();if(!url){tg?.showAlert?.('Платіж ще не налаштований. Після створення Telegram invoice-посилання його потрібно вставити у config.js.');return}if(!tg?.openInvoice){window.open(url,'_blank');return}tg.openInvoice(url,async(status)=>{if(status==='paid'){state.premiumUntil=Date.now()+Number(CFG.premiumDays||30)*86400000;await save();tg.showPopup?.({title:'Преміум активовано',message:'Тепер вам доступні необмежені поради 💛',buttons:[{type:'ok'}]});renderPremium()}else if(status==='pending'){tg.showAlert?.('Telegram ще обробляє платіж. Після підтвердження відкрийте застосунок ще раз.')}else if(status==='failed'){tg.showAlert?.('Платіж не завершився. Спробуйте ще раз.')}})}
document.getElementById('backBtn').addEventListener('click',()=>show('home'));document.getElementById('premiumBackBtn').addEventListener('click',()=>show('home'));document.getElementById('premiumHomeBtn').addEventListener('click',openPremium);
load().then(setGreeting).then(renderCategories).catch(()=>{setGreeting();renderCategories()});
})();
</script>
</body></html>
